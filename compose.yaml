services:
  static-host:
    image: ghcr.io/pavlenkoia/static-host:latest
    environment:
      STATIC_HOST_BASE_DOMAIN: ${STATIC_HOST_BASE_DOMAIN:?Set STATIC_HOST_BASE_DOMAIN in .env}
      STATIC_HOST_ADMIN_PASSWORD: ${STATIC_HOST_ADMIN_PASSWORD:?Set STATIC_HOST_ADMIN_PASSWORD in .env}
    x-machines:
      - ${STATIC_HOST_MACHINE}
    x-caddy: |
      panel.${STATIC_HOST_BASE_DOMAIN}, mcp.${STATIC_HOST_BASE_DOMAIN}, upload.${STATIC_HOST_BASE_DOMAIN} {
        reverse_proxy {{upstreams 8081}}
      }
    volumes:
      - /var/lib/static-host:/data
    deploy:
      update_config:
        order: stop-first
