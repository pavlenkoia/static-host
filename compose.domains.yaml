services:
  static-host:
    environment:
      STATIC_HOST_DOMAIN_INGRESS_IPS: ${STATIC_HOST_DOMAIN_INGRESS_IPS:?Set STATIC_HOST_DOMAIN_INGRESS_IPS}
      STATIC_HOST_DOMAIN_RESERVED_HOSTS: ${STATIC_HOST_DOMAIN_RESERVED_HOSTS:-}
      STATIC_HOST_DOMAIN_ASK_LISTEN: 0.0.0.0:8082
    x-caddy: |
      panel.${STATIC_HOST_BASE_DOMAIN}, mcp.${STATIC_HOST_BASE_DOMAIN}, upload.${STATIC_HOST_BASE_DOMAIN} {
        reverse_proxy {{upstreams 8081}}
      }
      *.sites.${STATIC_HOST_BASE_DOMAIN} {
        tls {
          dns cloudflare {env.CLOUDFLARE_API_TOKEN}
        }
        reverse_proxy {{upstreams 8081}}
      }
      https:// {
        tls {
          on_demand
        }
        reverse_proxy {{upstreams 8081}}
      }
      http:// {
        redir https://{host}{uri} 308
      }
